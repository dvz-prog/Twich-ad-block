name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Montar estrutura do projeto
        run: |
          mkdir -p app/src/main/java/com/twitchadb/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv activity_main.xml app/src/main/res/layout/activity_main.xml
          mv strings.xml app/src/main/res/values/strings.xml
          mv MainActivity.java app/src/main/java/com/twitchadb/app/
          mv AdBlocker.java app/src/main/java/com/twitchadb/app/
          mv TwitchWebViewClient.java app/src/main/java/com/twitchadb/app/
          mv app_build.gradle app/build.gradle
          mv gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties

          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://repo1.maven.org/maven2/org/gradle/gradle-wrapper/8.1.1/gradle-wrapper-8.1.1.jar

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: twitch-adblock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
