name: Criar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Montar estrutura do projeto
        run: |
          mkdir -p app/src/main/java/com/twitchadb/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv activity_main.xml app/src/main/res/layout/activity_main.xml
          mv strings.xml app/src/main/res/values/strings.xml
          mv MainActivity.java app/src/main/java/com/twitchadb/app/
          mv AdBlocker.java app/src/main/java/com/twitchadb/app/
          mv TwitchWebViewClient.java app/src/main/java/com/twitchadb/app/
          mv app_build.gradle app/build.gradle
          mv gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.1.1/gradle/wrapper/gradle-wrapper.jar

      - name: Restaurar gradlew
        run: |
          printf '#!/bin/sh\njava -jar "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"\n' > gradlew
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verificar APK
        run: find . -name "*.apk" 2>/dev/null || echo "APK nao encontrado"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: twitch-adblock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
